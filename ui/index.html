<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSnap</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div class="app-main">
            <div class="url-area">
                <div class="url-area-toolbar" id="urlAreaToolbar" hidden>
                    <button type="button" class="text-btn" id="discardAllBtn">Discard all</button>
                    <span class="link-count" id="linkCount"></span>
                    <div class="capture-progress" id="captureProgress" hidden>
                        <div class="capture-progress-track">
                            <div class="capture-progress-fill" id="captureProgressFill"></div>
                        </div>
                        <span class="capture-progress-label" id="captureProgressLabel"></span>
                    </div>
                </div>
                <div class="url-input-wrap" id="urlInputWrap">
                    <textarea id="urlWell" class="url-well" placeholder="Paste your URLs here&#10;One link per line" spellcheck="false"></textarea>
                </div>
                <div class="url-cards-wrap" id="urlCardsWrap" hidden>
                    <div class="url-cards" id="urlCards"></div>
                </div>
            </div>

            <div class="format-row" role="group" aria-label="Output formats">
                <div class="images-group" id="imagesGroup">
                    <button type="button" class="format-btn active" id="imagesBtn" aria-pressed="true">
                        <svg class="format-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M10 3L4.5 8.5 2 6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Images
                    </button>
                    <div class="viewport-wrap" id="viewportWrap">
                        <button type="button" class="viewport-btn" id="viewportBtn" aria-haspopup="listbox" aria-expanded="false">
                            <span id="viewportLabel">Laptop</span>
                            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
                        </button>
                        <div class="viewport-menu" id="viewportMenu" hidden role="listbox">
                            <button type="button" class="viewport-option" data-viewport="390x844" data-label="Mobile">Mobile · 390×844</button>
                            <button type="button" class="viewport-option" data-viewport="768x1024" data-label="Tablet">Tablet · 768×1024</button>
                            <button type="button" class="viewport-option active" data-viewport="1366x900" data-label="Laptop">Laptop · 1366×900</button>
                            <button type="button" class="viewport-option" data-viewport="1536x864" data-label="Desktop">Desktop · 1536×864</button>
                            <button type="button" class="viewport-option" data-viewport="1920x1080" data-label="Full HD">Full HD · 1920×1080</button>
                        </div>
                    </div>
                </div>
                <button type="button" class="format-btn" id="htmlBtn" aria-pressed="false">
                    <svg class="format-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 6h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    HTML
                </button>
            </div>

            <div class="folder-picker" id="folderPicker" role="button" tabindex="0">
                <span class="folder-label">Save to:</span>
                <span class="folder-path" id="folderPath">Downloads</span>
            </div>

        </div>

        <footer class="app-footer">
            <button type="button" class="btn-capture" id="actionBtn" disabled>Capture</button>
        </footer>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="app.js"></script>
</body>
</html>
